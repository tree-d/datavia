[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datavia-soil"
version = "1.0.0-dev"
description = "Soil data pipeline for Datavia" 
authors = [
    {name = "Michael Berg", email = "michael.berg@ufz.de"},
]
readme = "README_soil.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["geospatial", "soil", "soilgrids", "datavia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License", 
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "datavia>=1.0.0-dev",        # Requires core datavia
    "soilgrids>=0.1.0,<1.0",     # Soil-specific dependency
]

[project.urls]
Homepage = "https://github.com/tree-d/datavia"
Repository = "https://github.com/tree-d/datavia.git"
Issues = "https://github.com/tree-d/datavia/issues"

# Package configuration - SOIL ONLY
[tool.hatch.build]
include = [
    "datavia/soil/**/*.py",
]
exclude = [
    "datavia/core/**/*",
    "datavia/library/**/*",
    "datavia/elevation/**/*", 
    "datavia/weather/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["datavia"]