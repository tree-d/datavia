[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datavia-elevation"
version = "1.0.1-dev"
description = "Elevation data pipeline for Datavia"
authors = [
    {name = "Michael Berg", email = "michael.berg@ufz.de"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = ["geospatial", "elevation", "topography", "datavia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "datavia>=1.0.0.dev0,<2.0",
    "rasterio>=1.4.3,<2",
    "numpy>=2.0.0,<3",
]

[project.urls]
Homepage = "https://github.com/tree-d/datavia"
Repository = "https://github.com/tree-d/datavia.git"
Issues = "https://github.com/tree-d/datavia/issues"

# Package configuration - ELEVATION ONLY
# datavia/ is a namespace package (PEP 420 implicit): no __init__.py is
# included here. Python merges namespace contributions from all sys.path
# entries automatically without any stub file.
[tool.hatch.build]
include = [
    "datavia/elevation/**/*.py",
]

[tool.hatch.build.targets.wheel]
packages = ["datavia"]

[tool.hatch.build.targets.editable]
mode = "strict"

# Allow direct file references for local packages
[tool.hatch.metadata]
allow-direct-references = true