[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datavia-weather"
version = "1.0.0-dev"
description = "Weather data pipeline for Datavia" 
authors = [
    {name = "Michael Berg", email = "michael.berg@ufz.de"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = ["geospatial", "weather", "datavia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "datavia>=1.0.0.dev0,<2.0",
    "requests>=2.32.3,<3.0",
    "numpy>=2.0.0,<3",
    "xarray>=2024.0,<2027",
    "netCDF4>=1.7,<2",
    "pyarrow>=14.0",
    "pandas>=2.2.0,<3",
]

# ERA5 downloads require a valid ~/.cdsapirc credentials file.
# See https://cds.climate.copernicus.eu/how-to-api
[project.optional-dependencies]
era5 = [
    "cdsapi>=0.7",
]

[project.urls]
Homepage = "https://github.com/tree-d/datavia"
Repository = "https://github.com/tree-d/datavia.git"
Issues = "https://github.com/tree-d/datavia/issues"

# Package configuration
# datavia/ is a namespace package (PEP 420 implicit): no __init__.py is
# included here. Python merges namespace contributions from all sys.path
# entries automatically without any stub file.
[tool.hatch.build]
include = [
    "datavia/weather/**/*.py",
]

[tool.hatch.build.targets.wheel]
packages = ["datavia"]

[tool.hatch.build.targets.editable]
mode = "strict"

# Allow direct file references for local packages
[tool.hatch.metadata]
allow-direct-references = true