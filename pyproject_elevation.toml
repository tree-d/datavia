[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datavia-elevation"
version = "1.0.0-dev"
description = "Elevation data pipeline for Datavia"
authors = [
    {name = "Michael Berg", email = "michael.berg@ufz.de"},
]
readme = "README_elevation.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["geospatial", "elevation", "topography", "datavia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research", 
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "datavia>=1.0.0-dev",  # Requires core datavia
]

[project.urls]
Homepage = "https://github.com/tree-d/datavia"
Repository = "https://github.com/tree-d/datavia.git"
Issues = "https://github.com/tree-d/datavia/issues"

# Package configuration - ELEVATION ONLY
[tool.hatch.build]
include = [
    "datavia/elevation/**/*.py",
]
exclude = [
    "datavia/core/**/*",
    "datavia/library/**/*", 
    "datavia/soil/**/*",
    "datavia/weather/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["datavia"]