# Docker Compose file for setting up a PostGIS database
# For production: Set POSTGRES_PASSWORD environment variable or create .env file
# See .env.example for template

services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: gis
      # Development default (INSECURE): datavia_dev
      # Production: Set via environment variable or .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datavia_dev}
    ports:
      - "5432:5432"
    volumes:
      - ./library/database:/docker-entrypoint-initdb.d
