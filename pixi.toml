[workspace]
authors = ["Michael Berg <michael.berg@ufz.de>"]
channels = ["conda-forge"]
name = "datavia"
platforms = ["linux-64"]
version = "1.0.0"

# Ensure the workspace root is first on sys.path for every Python process
# launched in this environment. This prevents the namespace-only stub that
# sub-packages install into site-packages from shadowing the real
# datavia/__init__.py (which defines the Datavia class).
# PYTHONPATH is processed before site-packages in Python's startup sequence.
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

[tasks]
docs = {cmd = "pixi run sphinx-build -E -b html docs docs/_build/html"}
test = {cmd = "pixi run python -m pytest tests/ -v"}
test-docs = {cmd = "python scripts/test_docs_modern.py --format sphinx"}
test-docs-verbose = {cmd = "DATAVIA_DOCTEST_IO=0 python scripts/test_docs_modern.py --format sphinx --verbose"}
test-docs-with-io = {cmd = "python scripts/test_docs_with_io.py --verbose"}

# Development workflow tasks (require dev feature to be active)
# No suffix = core + all packages (used in CI and by default locally)
format = {cmd = "ruff format datavia/ tests/ packages/"}
format-check = {cmd = "ruff format --check datavia/ tests/ packages/"}
lint = {cmd = "ruff check datavia/ tests/ packages/"}
type-check = {cmd = "mypy datavia/ --ignore-missing-imports"}
security-scan = {cmd = "bandit -r datavia/ packages/ -f json -o bandit-report.json"}

# -core suffix = core and tests only, for faster local feedback when not touching packages
format-core = {cmd = "ruff format datavia/ tests/"}
format-check-core = {cmd = "ruff format --check datavia/ tests/"}
lint-core = {cmd = "ruff check datavia/ tests/"}

test-unit = {cmd = "python -m pytest tests/test_config.py tests/test_coordinate_transforms.py tests/test_runner.py tests/test_spatial_ops.py -v"}
test-integration = {cmd = "python -m pytest tests/test_e2e_workflows.py::TestContainerIntegration tests/test_e2e_workflows.py::TestDataQualityWorkflows::test_coordinate_validation_workflow tests/test_e2e_workflows.py::TestDataQualityWorkflows::test_spatial_bounds_validation_workflow tests/test_e2e_workflows.py::TestSpatialOperationsWorkflow tests/test_e2e_workflows.py::TestConfigurationWorkflows::test_global_config_workflow tests/test_e2e_workflows.py::TestErrorHandlingWorkflows -v"}
test-light = {cmd = "python -m pytest tests/ -v -k 'not test_elevation_pipeline and not test_elevation_pipeline_inside_datavia'"}

# Heavy integration tests (with running backend containers and network access)
test-e2e = {cmd = "DATAVIA_E2E=1 python -m pytest tests/ -v --cov=datavia --cov-report=xml --cov-report=html"}
ci-check = [{task = "format-check"}, {task = "lint"}, {task = "type-check"}, {task = "test-light"}]
ci-pr-check = [{task = "ci-check"}, {task = "docs"}, {task = "test-docs-verbose"}, {task = "security-scan"}]


# Development feature for CI/CD tools
[feature.dev.dependencies]
ruff = ">=0.8.0,<1.0"
mypy = ">=1.13.0,<2.0"
bandit = ">=1.9.3,<2.0"
pytest = ">=8.0.0,<9.0"
pytest-cov = ">=7.0.0,<8.0"
pytest-mock = ">=3.14.1,<4.0"
twine = ">=6.2.0,<7"
python-build = ">=1.2.0,<2"

# Environments
[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

