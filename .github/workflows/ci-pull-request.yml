---
# Datavia CI Pipeline for Pull Requests
#
# This workflow provides continuous integration checks for pull requests.
# It focuses on code quality, testing, and providing fast feedback to
# developers.
#
# Features:
# - Fail-fast code quality checks (formatting, linting, type checking)
# - Comprehensive testing across Python versions
# - Security scanning
# - Documentation validation
# - No auto-commits - developers must fix issues locally

name: CI - Pull Request

# Trigger only on pull requests
"on":
  pull_request:
    branches: [dev, main]
  # Allow manual triggering
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  PIXI_VERSION: 'latest'

jobs:
  # Job 1: Code Formatting Check (fail-fast)
  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install formatting tools
        run: pixi install -e dev

      - name: Check formatting and import sorting
        run: pixi run format-check

  # Job 2: Code Quality Analysis
  quality:
    name: Code Quality
    needs: format-check  # Run after formatting check passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install -e dev

      - name: Lint
        run: pixi run lint

      - name: Type checking
        run: pixi run type-check

  # Job 3: Testing Matrix
  test:
    name: Test Python ${{ matrix.python-version }}
    needs: format-check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install -e dev

      - name: Run unit tests
        run: |
          pixi run test-unit-ci -- \
            --junitxml=test-results-py${{ matrix.python-version }}.xml

      - name: Run integration tests
        run: pixi run test-integration

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results-py${{ matrix.python-version }}.xml
            htmlcov/
            .coverage

    # Only upload coverage from one Python version
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 4: Documentation Build
  docs:
    name: Documentation
    needs: format-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install

      - name: Build documentation
        run: |
          cd docs
          pixi run sphinx-build -b html . _build/html -W

      - name: Check documentation links
        run: |
          cd docs
          # Run linkcheck but do not fail immediately on the Sphinx exit code.
          # Sphinx exits 1 for both broken links AND connection timeouts.
          # CI runners can be blocked from reaching certain external hosts
          # (e.g. govdata.de) causing spurious timeout failures.
          # We parse the output explicitly and fail only on [broken] links,
          # so genuinely dead URLs are still caught.
          pixi run sphinx-build -b linkcheck . _build/linkcheck || true
          if grep -q '\[broken\]' _build/linkcheck/output.txt 2>/dev/null; then
            echo "Broken links found:"
            grep '\[broken\]' _build/linkcheck/output.txt
            exit 1
          fi

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pr
          path: docs/_build/html

  # Job 5: Documentation Code Test
  docs-test:
    name: Test Documentation Examples
    needs: format-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install -e dev

      - name: Test documentation code examples
        run: |
          pixi run test-docs-verbose

  # Job 6: Security Scan
  security:
    name: Security
    needs: format-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install -e dev

      - name: Security scan
        run: pixi run security-scan || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: |
            bandit-report.json
