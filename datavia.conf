# Datavia Configuration File
# This file contains all configuration settings for the Datavia geospatial data integration system.

[database]
# Database connection settings
host = localhost
port = 5432
database = gis
user = gis
# Password for development (INSECURE - change for production!)
# Production: Set POSTGRES_PASSWORD environment variable instead
# See .env.example for secure configuration
# You just have to use .env because config.py
# deciphers the password from environment variables,
# so this is just a fallback for development
password = ${POSTGRES_PASSWORD:-datavia_dev}
connection_pooling = true
ssl_mode = prefer

[paths]
# Storage mode controls where datavia keeps data files and logs.
#
#   project (default) — <cwd>/.datavia/
#       Per-project, self-contained.  Data lives next to your project files,
#       making it easy to see what belongs to which project.  A .gitignore is
#       written automatically so large GeoTIFF files are not committed to git.
#
#   global — ~/.datavia/
#       Shared across all projects.  Recommended when several projects use the
#       same datasets: large files are downloaded only once and reused.
#
# Uncomment one of the lines below to change the default:
# storage = project
# storage = global
#
# Advanced: set base_directory to a fully custom path instead.
# This takes precedence over storage when non-empty.
# base_directory = /data/shared/datavia
data_directory = data/
log_directory = logs/
path_validation = false
create_missing = true

[api]
# API configuration settings
timeout_policy = 30
retry_strategy = exponential
fallback_urls = true
url_validation = true
max_retries = 3

[spatial]
# Coordinate reference system and spatial settings
default_crs = EPSG:25832
coordinate_order = xy
error_handling = strict

[logging]
# Logging configuration
level = INFO
error_policy = user_notification
error_notifications = raise
