---
# Datavia Release Pipeline for PyPI Publishing
#
# This workflow handles official releases to PyPI when code is pushed to the
# release branch or when a release tag is created.
#
# Features:
# - Full test suite execution
# - Build and publish to PyPI
# - Create GitHub releases with changelogs
# - Tag management
#
# Setup Requirements:
# 1. Add PyPI API token as repository secret: PYPI_API_TOKEN
# 2. Add TestPyPI API token as repository secret: TEST_PYPI_API_TOKEN (optional)

name: Release - PyPI Publishing

# Trigger on pushes to release branch or release tags
"on":
  push:
    branches: [release]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      test_pypi_only:
        description: 'Publish to TestPyPI only (for testing)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  PIXI_VERSION: 'latest'

jobs:
  # Job 1: Full test suite (more comprehensive than CI)
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install

      # Run ALL tests including slower integration tests
      - name: Run comprehensive test suite
        run: |
          pixi run python -m pytest \
            tests/ \
            -v \
            --cov=datavia \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results-release-py${{ matrix.python-version }}.xml \
            --timeout=300  # 5 minute timeout for longer tests

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-release-py${{ matrix.python-version }}
          path: |
            test-results-release-py${{ matrix.python-version }}.xml
            htmlcov/
            .coverage

  # Job 2: Code Quality Gate (must pass for release)
  quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install

      # All quality checks must pass for release
      - name: Check formatting and import sorting
        run: pixi run format-check

      - name: Lint
        run: pixi run lint

      - name: Type checking
        run: pixi run type-check

      - name: Security scan
        run: pixi run security-scan
  # Job 3: Version Management
  version:
    name: Manage Version
    needs: [test, quality-gate]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger with specified version
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tagged release
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Branch release - extract version from pyproject.toml
            VERSION=$(grep '^version = ' pyproject.toml | \
              sed 's/version = "\(.*\)"/\1/' | tr -d '"')
            # Remove -dev suffix if present
            VERSION=${VERSION%-dev}
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/version = \".*\"/version = \"$VERSION\"/g" pyproject.toml
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pyproject.toml
          git diff --cached --exit-code || \
            git commit -m "Bump version to $VERSION"

  # Job 4: Build Release Packages
  build:
    name: Build Release Packages
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install build dependencies
        run: |
          pixi install
          pixi add build twine

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/version = \".*\"/version = \"$VERSION\"/g" pyproject.toml

      - name: Build packages
        run: |
          chmod +x scripts/build_packages.sh
          ./scripts/build_packages.sh

      - name: Verify packages
        run: |
          pixi run twine check dist/*.whl dist/*.tar.gz

      # Test installation
      - name: Test package installation
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl
          python -c "import datavia; print(f'Version: {datavia.__version__}')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-packages-${{ needs.version.outputs.version }}
          path: dist/

  # Job 5: Publish to TestPyPI (for testing)
  publish-test:
    name: Publish to TestPyPI
    needs: [test, quality-gate, version, build]
    runs-on: ubuntu-latest
    if: >
      needs.test.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      github.event.inputs.test_pypi_only == 'true' ||
      github.ref == 'refs/heads/release'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/datavia

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-packages-${{ needs.version.outputs.version }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Job 6: Publish to PyPI (production)
  publish-pypi:
    name: Publish to PyPI
    needs: [test, quality-gate, version, build, publish-test]
    runs-on: ubuntu-latest
    if: >
      needs.test.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      github.event.inputs.test_pypi_only != 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/release')
    environment:
      name: pypi
      url: https://pypi.org/p/datavia

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-packages-${{ needs.version.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Job 7: Create GitHub Release
  github-release:
    name: Create GitHub Release
    needs: [version, build, publish-pypi]
    runs-on: ubuntu-latest
    if: success() && github.event.inputs.test_pypi_only != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: release-packages-${{ needs.version.outputs.version }}
          path: dist/

      # Generate changelog
      - name: Generate changelog
        id: changelog
        run: |
          # Simple changelog generation
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ \
            2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            CHANGELOG=$(git log --oneline $LAST_TAG..HEAD \
              --pretty=format:"- %s (%h)")
          else
            CHANGELOG=$(git log --oneline \
              --pretty=format:"- %s (%h)" | head -20)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          VERSION: ${{ needs.version.outputs.version }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ env.VERSION }}
          body: |
            🎉 **Datavia ${{ env.VERSION }}**

            This release has been published to PyPI and is available for
            installation:

            ```bash
            pip install datavia==${{ env.VERSION }}
            ```

            ## Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            - **PyPI**: https://pypi.org/project/datavia/${{ env.VERSION }}/
            - **Documentation**: https://tree-d.github.io/datavia

            ## Checksums

            See attached files for package checksums.
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false

  # Job 8: Post-release tasks
  post-release:
    name: Post-release Tasks
    needs: [version, github-release]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Merge release branch back to main
      - name: Merge release to main
        if: github.ref == 'refs/heads/release'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin main
          git checkout main
          git merge origin/release --no-ff \
            -m "Merge release ${{ needs.version.outputs.version }} to main"
          git push origin main

      # Update version to next development version
      - name: Bump to next development version
        if: github.ref == 'refs/heads/release'
        run: |
          # This would increment version and add -dev suffix
          # You might want to create a script for this
          echo "Next development version bump would happen here"

      - name: Notify team
        run: |
          Version="${{ needs.version.outputs.version }}"
          echo "🎉 Release $Version completed successfully!"
          echo "📦 Published to PyPI: https://pypi.org/project/datavia/$Version/"
          echo "🏷️ GitHub release created: $Version"
          # Add Slack/Discord/email notifications here
