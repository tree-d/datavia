[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datavia"
version = "1.0.0-dev"
description = "Pipeline based Geospatial Data Integration System"
authors = [
    {name = "Michael Berg", email = "michael.berg@ufz.de"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
keywords = ["geospatial", "gis", "data-integration", "topography", "soil", "fetcher", "processor", "getter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.2.0,<3.0",
    "rasterio>=1.4.3,<2.0",
    "pyproj>=3.7.1,<4.0",
    "requests>=2.32.3,<3.0",
    "fastapi>=0.115.12,<1.0",
    "uvicorn>=0.34.2,<1.0",
    "sqlalchemy>=2.0.41,<3.0",
    "pandas>=2.2.3,<3.0",
    "pydantic>=2.11.4,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "python-dotenv>=1.1.0,<2.0",
    "pyyaml>=6.0.2,<7.0",
    "tqdm>=4.67.1,<5.0",
    "click>=8.1.8,<9.0",
    "rich>=14.0.0,<15.0",
    "matplotlib>=3.10.1,<4.0",
    "scipy>=1.16.0,<2.0",
    "tifffile>=2025.3.30",
]

[project.scripts]
datavia = "datavia.cli:main"


# Optional dependencies for development and testing
[project.optional-dependencies]
# Pipeline-specific dependencies (separate local packages)
elevation = [
    "datavia-elevation>=1.0.0.dev0,<2.0",
]
soil = [
    "datavia-soil>=1.0.0.dev0,<2.0",
]
weather = [
    "datavia-weather>=1.0.0.dev0,<2.0",
]
vector = [
    "fiona>=1.10.1,<2",
    "shapely>=2.0.4,<3.0",
]

# Combined pipeline dependencies
pipelines = [
    "datavia[elevation]",
    "datavia[soil]",
]
all = [
    "datavia[pipelines]",
    "datavia[vector]",
]

dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=7.0.0,<8.0",
    "pytest-mock>=3.14.1,<4.0",
    "xdoctest>=1.1.0,<2.0",
    "ruff>=0.8.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "bandit>=1.9.3,<2.0",
    "build>=1.3.0,<2.0",
]
test = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=7.0.0,<8.0",
    "pytest-mock>=3.14.1,<4.0",
]
docs = [
    "sphinx>=9.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
    "xdoctest>=1.1.0,<2.0",
    "alabaster>=1.0.0",
    "babel>=2.17.0",
    "docutils>=0.21.2",
    "imagesize>=1.4.1",
    "snowballstemmer>=3.0.1",
    "sphinxcontrib-applehelp>=2.0.0",
    "sphinxcontrib-devhelp>=2.0.0",
    "sphinxcontrib-htmlhelp>=2.1.0",
    "sphinxcontrib-jsmath>=1.0.1",
    "sphinxcontrib-qthelp>=2.0.0",
    "sphinxcontrib-serializinghtml>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/tree-d/datavia"
Documentation = "https://tree-d.github.io/datavia"
Repository = "https://github.com/tree-d/datavia.git"
Issues = "https://github.com/tree-d/datavia/issues"

# Package configuration - CORE ONLY
[tool.hatch.build]
include = [
    "datavia/__init__.py",
    "datavia/core/**/*.py", 
    "datavia/library/**/*.py",
    "datavia/library/**/*.sql",
    "datavia/cli.py",
    "datavia/cli_config.py",
    "datavia/cli_utils.py",
    "datavia/config.py",
    "datavia.conf",
    "README.md",
]
exclude = [
    "datavia/elevation/**/*",
    "datavia/soil/**/*",
    "datavia/weather/**/*",
    "packages/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["datavia"]

# Allow direct file references for local packages
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming (enforces naming conventions per coding standards)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PLC", # pylint conventions
    "PLE", # pylint errors
    "PLW", # pylint warnings
    "D100", # missing docstring in public module
    "D101", # missing docstring in public class
    "D102", # missing docstring in public method
    "D103", # missing docstring in public function
    "D104", # missing docstring in public package
    "D107", # missing docstring in __init__
]
ignore = [
    "E501", # line too long (handled by ruff format)
    "B008", # do not perform function calls in argument defaults
    "N999", # invalid module name (for packages)
]

[tool.ruff.lint.per-file-ignores]
# Test method/function names are self-describing per the naming standards (AC1+);
# class-level docstrings already document the test group.
"tests/**" = ["D102", "D103"]

[tool.ruff.lint.pep8-naming]
# Enforce naming conventions per coding standards AC1+ and AC2+
# Allow leading underscores for private/protected (Python convention AC2+)
ignore-names = ["_*", "__*"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=datavia --cov-report=term-missing"
# Enable doctest discovery
doctest_optionflags = ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]
# Add doctests from docs and source
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Filter pyproj deprecation warnings - these come from pyproj internal code
filterwarnings = [
    "ignore::DeprecationWarning:pyproj.*",
    "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning",
]

# Security scanning configuration
[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B105"]  # Skip hardcoded password check for test database credentials

# Configuration for running doctests with pytest
[tool.xdoctest]
style = "google"
options = "+NORMALIZE_WHITESPACE"

[tool.pixi.workspace]
authors = ["Michael Berg <michael.berg@ufz.de>"]
channels = ["conda-forge"]
name = "datavia"
platforms = ["linux-64"]
version = "1.0.0"
requires-pixi = ">=0.63"

# Ensure the workspace root is first on sys.path for every Python process
# launched in this environment. This prevents the namespace-only stub that
# sub-packages install into site-packages from shadowing the real
# datavia/__init__.py (which defines the Datavia class).
# PYTHONPATH is processed before site-packages in Python's startup sequence.
[tool.pixi.activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT"

[tool.pixi.tasks]
docs = {cmd = "sphinx-build -E -b html docs docs/_build/html -W", default-environment = "dev"}
docs-linkcheck = {cmd = "sphinx-build -b linkcheck docs docs/_build/linkcheck", default-environment = "dev"}
test = {cmd = "pytest tests/ -v", default-environment = "dev"}
test-docs = {cmd = "python scripts/test_docs_modern.py --format sphinx", default-environment = "dev"}
test-docs-verbose = {cmd = "DATAVIA_DOCTEST_IO=0 python scripts/test_docs_modern.py --format sphinx --verbose", default-environment = "dev"}
test-docs-with-io = {cmd = "python scripts/test_docs_with_io.py --verbose", default-environment = "dev"}

# Development workflow tasks (require dev feature to be active)
# No suffix = core + all packages (used in CI and by default locally)
format = {cmd = "ruff format datavia/ tests/ packages/", default-environment = "dev"}
format-check = {cmd = "ruff format --check datavia/ tests/ packages/", default-environment = "dev"}
lint = {cmd = "ruff check datavia/ tests/ packages/", default-environment = "dev"}
type-check = {cmd = "mypy datavia/ --ignore-missing-imports", default-environment = "dev"}
security-scan = {cmd = "bandit -r datavia/ packages/ -f json -o bandit-report.json", default-environment = "dev"}

# -core suffix = core and tests only, for faster local feedback when not touching packages
format-core = {cmd = "ruff format datavia/ tests/", default-environment = "dev"}
format-check-core = {cmd = "ruff format --check datavia/ tests/", default-environment = "dev"}
lint-core = {cmd = "ruff check datavia/ tests/", default-environment = "dev"}

test-unit = {cmd = "pytest tests/test_config.py tests/test_coordinate_transforms.py tests/test_spatial_ops.py -v", default-environment = "dev"}
# CI variant of unit tests: adds coverage reporting; pass --junitxml=... via `pixi run test-unit-ci -- --junitxml=<file>`
test-unit-ci = {cmd = "pytest tests/test_config.py tests/test_coordinate_transforms.py tests/test_spatial_ops.py -v --cov=datavia --cov-report=xml --cov-report=html", default-environment = "dev"}
test-light = {cmd = "pytest tests/ -v -k 'not test_elevation_pipeline and not test_elevation_pipeline_inside_datavia'", default-environment = "dev"}

# Heavy integration tests (with running backend containers and network access)
test-e2e = {cmd = "DATAVIA_E2E=1 pytest tests/ -v --cov=datavia --cov-report=xml --cov-report=html", default-environment = "dev"}
ci-check = [{task = "format-check"}, {task = "lint"}, {task = "type-check"}, {task = "test-light"}]
ci-pr-check = [{task = "ci-check"}, {task = "docs"}, {task = "test-docs-verbose"}, {task = "security-scan"}]


# Development feature for CI/CD tools
[tool.pixi.feature.dev.pypi-dependencies]
sphinx = ">=9.0"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.8.0,<1.0"
mypy = ">=1.13.0,<2.0"
bandit = ">=1.9.3,<2.0"
pytest = ">=8.0.0,<9.0"
pytest-cov = ">=7.0.0,<8.0"
pytest-mock = ">=3.14.1,<4.0"
twine = ">=6.2.0,<7"
python-build = ">=1.2.0,<2"
types-requests = ">=2.32.4,<3"
types-shapely = ">=2.1.0,<3"
scipy-stubs = ">=1.16.0,<2"

# Environments
[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
vector = { features = ["vector"], solve-group = "default" }

[tool.pixi.dependencies]
python = ">=3.12" #
numpy = ">=2.2.0,<3"
rasterio = ">=1.4.3,<2"
gdal = ">=3.10.0" #
pyproj = ">=3.7.1,<4"
requests = ">=2.32.3,<3"
fastapi = ">=0.115.12,<1"
uvicorn = ">=0.34.2,<1"
sqlalchemy = ">=2.0.41,<3"
pandas = ">=2.2.3,<3"
pydantic = ">=2.11.4,<3"
python-multipart = ">=0.0.20,<1"
python-dotenv = ">=1.1.0,<2"
pyyaml = ">=6.0.2,<7"
tqdm = ">=4.67.1,<5"
click = ">=8.1.8,<9"
rich = ">=14.0.0,<15"
matplotlib = ">=3.10.1,<4"
scipy = ">=1.16.0,<2"

[tool.pixi.feature.vector.dependencies]
fiona = ">=1.10.1,<2"

[tool.pixi.pypi-dependencies]
soilgrids = "==0.1.0"
datavia = { path = ".", editable = true }
datavia-soil = { path = "./packages/soil/", editable = true }
datavia-elevation = { path = "./packages/elevation/", editable = true }
