---
# Datavia CI Pipeline for Pull Requests
#
# This workflow provides continuous integration checks for pull requests.
# It focuses on code quality, testing, and providing fast feedback to
# developers.
#
# Features:
# - Fail-fast code quality checks (formatting, linting, type checking)
# - Comprehensive testing across Python versions
# - Security scanning
# - Documentation validation
# - No auto-commits - developers must fix issues locally

name: CI - Pull Request

# Trigger only on pull requests
"on":
  pull_request:
    branches: [dev, main]
  # Allow manual triggering
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  PIXI_VERSION: 'latest'

jobs:
  # Job 1: Code Formatting Check (fail-fast)
  format-check:
    name: Code Formatting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install formatting tools
        run: |
          pixi install
          pixi add black isort

      # Fail-fast formatting checks
      - name: Check code formatting (black)
        run: pixi run black --check datavia/ tests/

      - name: Check import sorting (isort)
        run: pixi run isort --check-only datavia/ tests/

  # Job 2: Code Quality Analysis
  quality:
    name: Code Quality
    needs: format-check  # Run after formatting check passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: |
          pixi install
          pixi add ruff mypy

      - name: Lint with ruff
        run: |
          pixi run ruff check datavia/ tests/ --output-format=github

      - name: Type checking with mypy
        run: |
          pixi run mypy datavia/ --ignore-missing-imports

  # Job 3: Testing Matrix
  test:
    name: Test Python ${{ matrix.python-version }}
    needs: format-check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install

      - name: Run unit tests
        run: |
          pixi run python -m pytest \
            tests/test_config.py \
            tests/test_coordinate_transforms.py \
            tests/test_runner.py \
            tests/test_spatial_ops.py \
            -v \
            --cov=datavia \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results-py${{ matrix.python-version }}.xml

      - name: Run integration tests
        run: |
          F="tests/test_e2e_workflows.py"
          T="TestDataQualityWorkflows"
          pixi run python -m pytest \
            "$F::TestContainerIntegration" \
            "$F::$T::test_coordinate_validation_workflow" \
            "$F::$T::test_spatial_bounds_validation_workflow" \
            "$F::TestSpatialOperationsWorkflow" \
            "$F::TestConfigurationWorkflows::test_global_config_workflow" \
            "$F::TestErrorHandlingWorkflows" \
            -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results-py${{ matrix.python-version }}.xml
            htmlcov/
            .coverage

    # Only upload coverage from one Python version
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 4: Documentation Build
  docs:
    name: Documentation
    needs: format-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install

      - name: Build documentation
        run: |
          cd docs
          pixi run sphinx-build -b html . _build/html -W

      - name: Check documentation links
        run: |
          cd docs
          pixi run sphinx-build -b linkcheck . _build/linkcheck

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pr
          path: docs/_build/html

  # Job 5: Documentation Code Test
  docs-test:
    name: Test Documentation Examples
    needs: format-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install

      - name: Test documentation code examples
        run: |
          pixi run test-docs-verbose

  # Job 6: Security Scan
  security:
    name: Security
    needs: format-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install security tools
        run: |
          pixi install
          pixi add bandit

      - name: Security scan with bandit
        run: |
          pixi run bandit -r datavia/ -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: |
            bandit-report.json
