---
# Datavia CD Pipeline for Main Branch
#
# This workflow handles continuous deployment when code is merged to main.
# It builds, tests, and deploys development versions.
#
# Features:
# - Builds and publishes documentation to GitHub Pages
# - Creates development releases
# - Deploys to staging environments
# - Notifies team of successful deployments

name: CD - Main Branch

# Trigger on pushes to main branch
"on":
  push:
    branches: [dev] # for testing, change to main for production
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  PIXI_VERSION: 'latest'

jobs:
  # Job 1: Quick validation (lighter than full CI)
  validate:
    name: Quick Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: |
          pixi install
          pixi add black isort ruff

      - name: Quick lint check
        run: |
          pixi run ruff check datavia/ tests/

      - name: Run core tests
        run: |
          pixi run python -m pytest tests/test_config.py tests/test_runner.py -v

  # Job 2: Build Documentation and Deploy
  docs:
    name: Build & Deploy Documentation
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install dependencies
        run: pixi install

      - name: Build documentation
        run: |
          cd docs
          # Update version in docs
          echo "Building docs for commit $(git rev-parse --short HEAD)"
          pixi run sphinx-build -b html . _build/html -W

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  # Job 3: Build Development Release
  build:
    name: Build Development Release
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}

      - name: Install build dependencies
        run: |
          pixi install
          pixi add build twine

      # Generate development version number
      - name: Generate development version
        id: version
        run: |
          # Create version like 1.0.0-dev.20240203.abcdef0
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          VERSION="1.0.0-dev.$DATE.$COMMIT_SHORT"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Development version: $VERSION"

      # Update version in pyproject.toml
      - name: Update version
        run: |
          sed -i 's/version = ".*"/version = "${{ steps.version.outputs.version }}"/g' pyproject.toml
          
      - name: Build packages
        run: |
          chmod +x scripts/build_packages.sh
          ./scripts/build_packages.sh

      - name: Check packages
        run: |
          pixi run twine check dist/*.whl

      # Upload to GitHub Releases as development release
      - name: Create Development Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dev-${{ steps.version.outputs.version }}
          name: Development Release ${{ steps.version.outputs.version }}
          body: |
            🚀 **Development Release**
            
            This is an automated development release from the main branch.
            
            **Changes**: Commit ${{ github.sha }}
            **Built**: ${{ github.run_id }}
            
            ⚠️ **This is a development release - use with caution in production!**
          prerelease: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dev-packages-${{ steps.version.outputs.version }}
          path: dist/

  # Job 4: Deploy to Staging (if you have staging environment)
  deploy-staging:
    name: Deploy to Staging
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: github.event.inputs.force_deploy == 'true' || success()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Add your staging deployment steps here
    # This could be deploying to a test server, updating Docker images, etc.
    - name: Deploy to staging environment
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "This step would deploy your application to staging"
        echo "Examples: update Docker images, deploy to test servers, etc."
        
  # Job 5: Notification
  notify:
    name: Notify Team
    needs: [docs, build, deploy-staging]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify success
      if: needs.docs.result == 'success' && needs.build.result == 'success'
      run: |
        echo "✅ Deployment successful!"
        echo "📚 Documentation updated"
        echo "📦 Development release created"
        # Add webhook/Slack notification here if needed
        
    - name: Notify failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs for details"
        # Add error notification here