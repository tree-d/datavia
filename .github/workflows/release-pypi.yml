---
# Datavia Release Pipeline for PyPI Publishing
#
# This workflow handles official releases to PyPI when code is pushed to the
# release branch or when a release tag is created.
#
# Features:
# - Full test suite execution
# - Build and publish to PyPI
# - Create GitHub releases with changelogs
# - Tag management
#
# Setup Requirements:
# 1. Add PyPI API token as repository secret: PYPI_API_TOKEN
# 2. Add TestPyPI API token as repository secret: TEST_PYPI_API_TOKEN (optional)

name: Release - PyPI Publishing

# Trigger on pushes to release branch or release tags
"on":
  push:
    branches: [release]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0). Leave empty to use the version in pyproject.toml (stripping any -dev suffix).'
        required: false
        type: string
      test_pypi_only:
        description: 'Publish to TestPyPI only (for testing)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  PIXI_VERSION: 'latest'

jobs:
  # Job 1: Full test suite (more comprehensive than CI)
  test:
    name: Full Test Suite
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.12']
        # pyproject.toml requires Python >=3.12; testing older versions
        # would always fail at the dependency-install stage.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false

      - name: Install dependencies
        # run-install: false prevents setup-pixi from installing only the default
        # environment. We install dev explicitly so pytest and coverage are available.
        run: pixi install -e dev

      # Run ALL tests including slower integration tests
      - name: Run comprehensive test suite
        run: |
          pixi run -e dev pytest \
            tests/ \
            -v \
            --cov=datavia \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=test-results-release-py${{ matrix.python-version }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-release-py${{ matrix.python-version }}
          path: |
            test-results-release-py${{ matrix.python-version }}.xml
            htmlcov/
            .coverage

  # Job 2: Code Quality Gate (must pass for release)
  quality-gate:
    name: Release Quality Gate
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false

      - name: Install dependencies
        # run-install: false prevents setup-pixi from installing only the default
        # environment. We install dev explicitly so ruff, mypy and bandit are available.
        run: pixi install -e dev

      # All quality checks must pass for release
      - name: Check formatting and import sorting
        run: pixi run format-check

      - name: Lint
        run: pixi run lint

      - name: Type checking
        run: pixi run type-check

      - name: Security scan
        run: pixi run security-scan
  # Job 3: Version Management
  version:
    name: Manage Version
    needs: [test, quality-gate]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            # Manual trigger with explicitly specified version
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tagged release
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Branch release - extract version from pyproject.toml
            VERSION=$(grep '^version = ' pyproject.toml | \
              sed 's/version = "\(.*\)"/\1/' | tr -d '"')
            # Remove -dev suffix if present
            VERSION=${VERSION%-dev}
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      # Version is managed manually in pyproject.toml before pushing to release.
      # The build job applies the version to pyproject.toml at build time via sed,
      # so no git write-back is needed here.

  # Job 4: Build Release Packages
  build:
    name: Build Release Packages
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false

      - name: Install build dependencies
        # run-install: false prevents setup-pixi from installing only the default
        # environment. We install dev explicitly so python-build and twine are available.
        run: pixi install -e dev

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/version = \".*\"/version = \"$VERSION\"/g" pyproject.toml
          sed -i "s/version = \".*\"/version = \"$VERSION\"/g" packages/elevation/pyproject.toml
          sed -i "s/version = \".*\"/version = \"$VERSION\"/g" packages/soil/pyproject.toml
          sed -i "s/version = \".*\"/version = \"$VERSION\"/g" packages/weather/pyproject.toml

      - name: Clean previous builds
        run: |
          rm -rf dist/ build/ *.egg-info/
          rm -rf packages/*/dist/ packages/*/build/ packages/*/*.egg-info/

      - name: Build core datavia package
        run: pixi run -e dev python -m build

      - name: Build elevation package
        working-directory: packages/elevation
        run: pixi run -e dev --manifest-path ../../pyproject.toml python -m build

      - name: Build soil package
        working-directory: packages/soil
        run: pixi run -e dev --manifest-path ../../pyproject.toml python -m build

      - name: Build weather package
        working-directory: packages/weather
        run: pixi run -e dev --manifest-path ../../pyproject.toml python -m build

      - name: Collect all dist artifacts
        run: |
          mkdir -p dist/
          find packages/*/dist/ -name "*.whl" -o -name "*.tar.gz" | \
            xargs -I{} cp {} dist/ 2>/dev/null || true

      - name: Verify packages
        # twine is a dev-feature tool; must run in the dev environment.
        run: |
          pixi run -e dev twine check dist/*.whl dist/*.tar.gz

      # Test installation into an isolated target directory to avoid
      # conflicts with the datavia already present in the pixi dev env.
      - name: Test package installation
        run: |
          pixi run -e dev pip install dist/datavia-*.whl --target /tmp/wheel_test
          pixi run -e dev python -c "
          import sys; sys.path.insert(0, '/tmp/wheel_test')
          import datavia; print(f'Version: {datavia.__version__}')
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ needs.version.outputs.version }}
          path: dist/

  # Job 5: Publish to TestPyPI (for testing)
  publish-test:
    name: Publish to TestPyPI
    needs: [test, quality-gate, version, build]
    runs-on: ubuntu-latest
    # Parentheses are required: without them || binds more loosely than &&,
    # making the last condition (push to release branch) bypass all quality checks.
    if: >
      needs.test.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      (github.event.inputs.test_pypi_only == 'true' ||
      github.ref == 'refs/heads/release')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.version.outputs.version }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Job 6: Publish to PyPI (production)
  publish-pypi:
    name: Publish to PyPI
    needs: [test, quality-gate, version, build, publish-test]
    runs-on: ubuntu-latest
    # != 'failure' (not == 'success') allows this job to proceed when
    # publish-test was 'skipped' (e.g. tag-only releases without TestPyPI step).
    if: >
      needs.test.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      needs.publish-test.result != 'failure' &&
      github.event.inputs.test_pypi_only != 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/release')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.version.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Job 7: Create GitHub Release
  github-release:
    name: Create GitHub Release
    needs: [version, build, publish-pypi]
    runs-on: ubuntu-latest
    if: success() && github.event.inputs.test_pypi_only != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.version.outputs.version }}
          path: dist/

      # Generate changelog
      - name: Generate changelog
        id: changelog
        run: |
          # Simple changelog generation
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ \
            2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            CHANGELOG=$(git log --oneline $LAST_TAG..HEAD \
              --pretty=format:"- %s (%h)")
          else
            CHANGELOG=$(git log --oneline \
              --pretty=format:"- %s (%h)" | head -20)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          VERSION: ${{ needs.version.outputs.version }}
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ env.VERSION }}
          body: |
            🎉 **Datavia ${{ env.VERSION }}**

            This release has been published to PyPI and is available for
            installation:

            ```bash
            pip install datavia==${{ env.VERSION }}
            ```

            ## Changes
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            - **PyPI**: https://pypi.org/project/datavia/${{ env.VERSION }}/
            - **Documentation**: https://tree-d.github.io/datavia

            ## Checksums

            See attached files for package checksums.
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false

  # Job 8: Post-release tasks
  post-release:
    name: Post-release Tasks
    needs: [version, github-release]
    runs-on: ubuntu-latest
    # Use explicit job-result checks instead of success() so this job is not
    # skipped when github-release itself was skipped (e.g. test_pypi_only run).
    if: >
      needs.version.result == 'success' &&
      needs.github-release.result != 'failure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Update version to next development version.
      - name: Bump to next development version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          VERSION="${{ needs.version.outputs.version }}"
          # Split released version into components (e.g. 1.2.3 → 1 2 3)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT_DEV="${MAJOR}.${MINOR}.$((PATCH + 1))-dev"

          # Apply next dev version to all packages
          sed -i "s/version = \".*\"/version = \"$NEXT_DEV\"/g" pyproject.toml
          sed -i "s/version = \".*\"/version = \"$NEXT_DEV\"/g" packages/elevation/pyproject.toml
          sed -i "s/version = \".*\"/version = \"$NEXT_DEV\"/g" packages/soil/pyproject.toml
          sed -i "s/version = \".*\"/version = \"$NEXT_DEV\"/g" packages/weather/pyproject.toml

          git add pyproject.toml \
                  packages/elevation/pyproject.toml \
                  packages/soil/pyproject.toml \
                  packages/weather/pyproject.toml
          git commit -m "chore: bump version to ${NEXT_DEV} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          echo "Bumped to next development version: $NEXT_DEV"

      - name: Notify team
        run: |
          Version="${{ needs.version.outputs.version }}"
          echo "🎉 Release $Version completed successfully!"
          echo "📦 Published to PyPI: https://pypi.org/project/datavia/$Version/"
          echo "🏷️ GitHub release created: $Version"
          # Add Slack/Discord/email notifications here
