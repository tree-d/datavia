# Datavia Release Pipeline for PyPI Publishing
# 
# This workflow handles official releases to PyPI when code is pushed to the release branch
# or when a release tag is created.
#
# Features:
# - Full test suite execution
# - Build and publish to PyPI
# - Create GitHub releases with changelogs
# - Tag management
#
# Setup Requirements:
# 1. Add PyPI API token as repository secret: PYPI_API_TOKEN
# 2. Add TestPyPI API token as repository secret: TEST_PYPI_API_TOKEN (optional)

name: Release - PyPI Publishing

# Trigger on pushes to release branch or release tags
on:
  push:
    branches: [ release ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      test_pypi_only:
        description: 'Publish to TestPyPI only (for testing)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  PIXI_VERSION: 'latest'

jobs:
  # Job 1: Full test suite (more comprehensive than CI)
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.4.1
      with:
        pixi-version: ${{ env.PIXI_VERSION }}

    - name: Install dependencies
      run: pixi install

    # Run ALL tests including slower integration tests
    - name: Run comprehensive test suite
      run: |
        pixi run python -m pytest \\\n          tests/ \\\n          -v \\\n          --cov=datavia \\\n          --cov-report=xml \\\n          --cov-report=html \\\n          --junitxml=test-results-release-py${{ matrix.python-version }}.xml \\\n          --timeout=300  # 5 minute timeout for longer tests

    - name: Upload test results
      uses: actions/upload-artifact@v3\n      if: always()\n      with:\n        name: test-results-release-py${{ matrix.python-version }}\n        path: |\n          test-results-release-py${{ matrix.python-version }}.xml\n          htmlcov/\n          .coverage

  # Job 2: Code Quality Gate (must pass for release)\n  quality-gate:\n    name: Release Quality Gate\n    runs-on: ubuntu-latest\n    \n    steps:\n    - name: Checkout repository\n      uses: actions/checkout@v4\n      with:\n        fetch-depth: 0\n\n    - name: Setup Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: ${{ env.PYTHON_VERSION }}\n\n    - name: Setup pixi\n      uses: prefix-dev/setup-pixi@v0.4.1\n      with:\n        pixi-version: ${{ env.PIXI_VERSION }}\n\n    - name: Install dependencies\n      run: |\n        pixi install\n        pixi add black isort ruff mypy bandit safety\n\n    # All quality checks must pass for release\n    - name: Check code formatting (black)\n      run: pixi run black --check datavia/ tests/\n\n    - name: Check import sorting (isort)\n      run: pixi run isort --check-only datavia/ tests/\n\n    - name: Lint code (ruff)\n      run: pixi run ruff check datavia/ tests/\n\n    - name: Type checking (mypy)\n      run: pixi run mypy datavia/ --ignore-missing-imports\n\n    - name: Security scan (bandit)\n      run: pixi run bandit -r datavia/ -ll\n\n    - name: Dependency vulnerability check (safety)\n      run: pixi run safety check\n\n  # Job 3: Version Management\n  version:\n    name: Manage Version\n    needs: [test, quality-gate]\n    runs-on: ubuntu-latest\n    outputs:\n      version: ${{ steps.version.outputs.version }}\n      tag: ${{ steps.version.outputs.tag }}\n    \n    steps:\n    - name: Checkout repository\n      uses: actions/checkout@v4\n      with:\n        fetch-depth: 0\n\n    - name: Determine version\n      id: version\n      run: |\n        if [[ \"${{ github.event_name }}\" == \"workflow_dispatch\" ]]; then\n          # Manual trigger with specified version\n          VERSION=\"${{ github.event.inputs.version }}\"\n        elif [[ \"${{ github.ref }}\" == refs/tags/v* ]]; then\n          # Tagged release\n          VERSION=${GITHUB_REF#refs/tags/v}\n        else\n          # Branch release - extract version from pyproject.toml and ensure it's a release version\n          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = \"\\(.*\\)\"/\\1/' | tr -d '\"')\n          # Remove -dev suffix if present\n          VERSION=${VERSION%-dev}\n        fi\n        \n        echo \"version=$VERSION\" >> $GITHUB_OUTPUT\n        echo \"tag=v$VERSION\" >> $GITHUB_OUTPUT\n        echo \"Release version: $VERSION\"\n\n    - name: Update version in pyproject.toml\n      run: |\n        sed -i 's/version = \".*\"/version = \"${{ steps.version.outputs.version }}\"/g' pyproject.toml\n        git config --local user.email \"action@github.com\"\n        git config --local user.name \"GitHub Action\"\n        git add pyproject.toml\n        git diff --cached --exit-code || git commit -m \"Bump version to ${{ steps.version.outputs.version }}\"\n\n  # Job 4: Build Release Packages\n  build:\n    name: Build Release Packages\n    needs: version\n    runs-on: ubuntu-latest\n    \n    steps:\n    - name: Checkout repository\n      uses: actions/checkout@v4\n      with:\n        fetch-depth: 0\n\n    - name: Setup Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: ${{ env.PYTHON_VERSION }}\n\n    - name: Setup pixi\n      uses: prefix-dev/setup-pixi@v0.4.1\n      with:\n        pixi-version: ${{ env.PIXI_VERSION }}\n\n    - name: Install build dependencies\n      run: |\n        pixi install\n        pixi add build twine\n\n    - name: Update version in pyproject.toml\n      run: |\n        sed -i 's/version = \".*\"/version = \"${{ needs.version.outputs.version }}\"/g' pyproject.toml\n        \n    - name: Build packages\n      run: |\n        chmod +x scripts/build_packages.sh\n        ./scripts/build_packages.sh\n\n    - name: Verify packages\n      run: |\n        pixi run twine check dist/*.whl dist/*.tar.gz\n        \n    # Test installation\n    - name: Test package installation\n      run: |\n        python -m venv test_env\n        source test_env/bin/activate\n        pip install dist/*.whl\n        python -c \"import datavia; print(f'Successfully imported datavia version: {datavia.__version__}')\"\n\n    - name: Upload build artifacts\n      uses: actions/upload-artifact@v3\n      with:\n        name: release-packages-${{ needs.version.outputs.version }}\n        path: dist/\n\n  # Job 5: Publish to TestPyPI (for testing)\n  publish-test:\n    name: Publish to TestPyPI\n    needs: [version, build]\n    runs-on: ubuntu-latest\n    if: github.event.inputs.test_pypi_only == 'true' || github.ref == 'refs/heads/release'\n    environment:\n      name: testpypi\n      url: https://test.pypi.org/p/datavia\n    \n    steps:\n    - name: Download artifacts\n      uses: actions/download-artifact@v3\n      with:\n        name: release-packages-${{ needs.version.outputs.version }}\n        path: dist/\n\n    - name: Publish to TestPyPI\n      uses: pypa/gh-action-pypi-publish@release/v1\n      with:\n        password: ${{ secrets.TEST_PYPI_API_TOKEN }}\n        repository-url: https://test.pypi.org/legacy/\n        skip-existing: true\n\n  # Job 6: Publish to PyPI (production)\n  publish-pypi:\n    name: Publish to PyPI\n    needs: [version, build, publish-test]\n    runs-on: ubuntu-latest\n    if: github.event.inputs.test_pypi_only != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release')\n    environment:\n      name: pypi\n      url: https://pypi.org/p/datavia\n    \n    steps:\n    - name: Download artifacts\n      uses: actions/download-artifact@v3\n      with:\n        name: release-packages-${{ needs.version.outputs.version }}\n        path: dist/\n\n    - name: Publish to PyPI\n      uses: pypa/gh-action-pypi-publish@release/v1\n      with:\n        password: ${{ secrets.PYPI_API_TOKEN }}\n\n  # Job 7: Create GitHub Release\n  github-release:\n    name: Create GitHub Release\n    needs: [version, build, publish-pypi]\n    runs-on: ubuntu-latest\n    if: success() && github.event.inputs.test_pypi_only != 'true'\n    \n    steps:\n    - name: Checkout repository\n      uses: actions/checkout@v4\n      with:\n        fetch-depth: 0\n\n    - name: Download artifacts\n      uses: actions/download-artifact@v3\n      with:\n        name: release-packages-${{ needs.version.outputs.version }}\n        path: dist/\n\n    # Generate changelog\n    - name: Generate changelog\n      id: changelog\n      run: |\n        # Simple changelog generation\n        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo \"\")\n        if [[ -n \"$LAST_TAG\" ]]; then\n          CHANGELOG=$(git log --oneline $LAST_TAG..HEAD --pretty=format:\"- %s (%h)\")\n        else\n          CHANGELOG=$(git log --oneline --pretty=format:\"- %s (%h)\" | head -20)\n        fi\n        echo \"CHANGELOG<<EOF\" >> $GITHUB_OUTPUT\n        echo \"$CHANGELOG\" >> $GITHUB_OUTPUT\n        echo \"EOF\" >> $GITHUB_OUTPUT\n\n    - name: Create Release\n      uses: softprops/action-gh-release@v1\n      with:\n        tag_name: ${{ needs.version.outputs.tag }}\n        name: Release ${{ needs.version.outputs.version }}\n        body: |\n          🎉 **Datavia ${{ needs.version.outputs.version }}**\n          \n          This release has been published to PyPI and is available for installation:\n          \n          ```bash\n          pip install datavia==${{ needs.version.outputs.version }}\n          ```\n          \n          ## Changes\n          ${{ steps.changelog.outputs.CHANGELOG }}\n          \n          ## Installation\n          \n          - **PyPI**: https://pypi.org/project/datavia/${{ needs.version.outputs.version }}/\n          - **Documentation**: https://tree-d.github.io/datavia\n          \n          ## Checksums\n          \n          See attached files for package checksums.\n        files: |\n          dist/*.whl\n          dist/*.tar.gz\n        draft: false\n        prerelease: false\n\n  # Job 8: Post-release tasks\n  post-release:\n    name: Post-release Tasks\n    needs: [version, github-release]\n    runs-on: ubuntu-latest\n    if: success()\n    \n    steps:\n    - name: Checkout repository\n      uses: actions/checkout@v4\n      with:\n        token: ${{ secrets.GITHUB_TOKEN }}\n        fetch-depth: 0\n\n    # Merge release branch back to main\n    - name: Merge release to main\n      if: github.ref == 'refs/heads/release'\n      run: |\n        git config --local user.email \"action@github.com\"\n        git config --local user.name \"GitHub Action\"\n        git fetch origin main\n        git checkout main\n        git merge origin/release --no-ff -m \"Merge release ${{ needs.version.outputs.version }} to main\"\n        git push origin main\n\n    # Update version to next development version\n    - name: Bump to next development version\n      if: github.ref == 'refs/heads/release'\n      run: |\n        # This would increment version and add -dev suffix\n        # You might want to create a script for this\n        echo \"Next development version bump would happen here\"\n        \n    - name: Notify team\n      run: |\n        echo \"🎉 Release ${{ needs.version.outputs.version }} completed successfully!\"\n        echo \"📦 Published to PyPI: https://pypi.org/project/datavia/${{ needs.version.outputs.version }}/\"\n        echo \"🏷️ GitHub release created: ${{ needs.version.outputs.tag }}\"\n        # Add Slack/Discord/email notifications here